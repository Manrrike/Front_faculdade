<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Adega Royle</title>


</head>
<body>

    <!-- Conteúdo Principal / Produtos -->
    <div class="container">

        <div class="produtos">
            
            <!-- Produto 1 -->
            <div class="produto-card">
                <h3>Camiseta Básica</h3>
                <p class="preco">R$ 49,90</p>
                <button>Comprar</button>
            </div>

            <!-- Produto 2 -->
            <div class="produto-card">
                <h3>Tênis Esportivo</h3>
                <p class="preco">R$ 159,90</p>
                <button>Comprar</button>
            </div>

            <!-- Produto 3 -->
            <div class="produto-card">
                <h3>Boné Estiloso</h3>
                <p class="preco">R$ 29,90</p>
                <button>Comprar</button>
            </div>

        </div>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Minha Loja. Todos os direitos reservados.</p>

</html>
